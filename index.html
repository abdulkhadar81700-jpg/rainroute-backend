<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainRoute Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        
        /* Side Panel Styling */
        #ui-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-width: 300px;
        }
        
        /* GPS Button Styling */
        #locate-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            padding: 12px 18px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        #locate-btn:hover { background: #0056b3; }

        input, button { width: 100%; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        #analyze-btn { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s;}
        #analyze-btn:hover { background: #218838; }
        #results { margin-top: 10px; font-size: 13px; color: #333; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- Locate Me Button -->
    <button id="locate-btn">📍 Locate Me</button>

    <!-- Left UI Panel -->
    <div id="ui-panel">
        <h3 style="margin-top: 0;">RainRoute</h3>
        <input type="text" id="operator-id" placeholder="Enter Operator ID">
        <button id="analyze-btn">Analyze Route Options</button>
        <div id="results">Click the map to drop your Start and Destination pins.</div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // Initialize Map
        var map = L.map('map').setView([16.5062, 80.6480], 6); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        var markers = [];

        // Handle Map Clicks
        map.on('click', function(e) {
            if (markers.length >= 2) {
                for (var i = 0; i < markers.length; i++) {
                    map.removeLayer(markers[i]);
                }
                markers = [];
            }
            
            var label = markers.length === 0 ? "Start" : "Destination";
            var marker = L.marker([e.latlng.lat, e.latlng.lng]).addTo(map).bindPopup("<b>" + label + "</b>").openPopup();
            markers.push(marker);
            
            if(markers.length === 2) {
                document.getElementById('results').innerHTML = "✅ Pins dropped! Ready to analyze.";
            }
        });

        // GPS Locate Me Logic
        document.getElementById('locate-btn').addEventListener('click', function() {
            if (navigator.geolocation) {
                this.innerHTML = "⏳ Locating..."; 
                
                navigator.geolocation.getCurrentPosition(function(position) {
                    var lat = position.coords.latitude;
                    var lon = position.coords.longitude;
                    
                    map.flyTo([lat, lon], 15, { animate: true, duration: 1.5 });
                    
                    L.marker([lat, lon]).addTo(map)
                        .bindPopup("<b>📍 You are here!</b>").openPopup();
                        
                    document.getElementById('locate-btn').innerHTML = "📍 Locate Me";
                }, function(error) {
                    alert("Could not get GPS location. Make sure location permissions are enabled.");
                    document.getElementById('locate-btn').innerHTML = "📍 Locate Me";
                });
            } else {
                alert("GPS is not supported by your browser.");
            }
        });

        // Send data to FastAPI Backend
        document.getElementById('analyze-btn').addEventListener('click', async function() {
            if (markers.length < 2) {
                alert("Please drop both a Start and Destination pin on the map first!");
                return;
            }
            
            document.getElementById('results').innerHTML = "⏳ Analyzing telemetry and weather data...";

            // FIXED PAYLOAD: Now matching the exact format FastAPI is asking for
            var payload = {
                waypoints: [
                    { lat: markers[0].getLatLng().lat, lon: markers[0].getLatLng().lng },
                    { lat: markers[1].getLatLng().lat, lon: markers[1].getLatLng().lng }
                ]
            };

            try {
                const response = await fetch('/api/evaluate-corridor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("Server returned " + response.status);
                
                const data = await response.json();
                
                document.getElementById('results').innerHTML = "<b>✅ Analysis Complete:</b><br><pre style='white-space: pre-wrap; word-wrap: break-word;'>" + JSON.stringify(data, null, 2) + "</pre>";
                
            } catch (error) {
                document.getElementById('results').innerHTML = "<span style='color:red;'>⚠️ Error connecting to backend.</span>";
                console.error("Fetch Error:", error);
            }
        });
    </script>
</body>
</html>
